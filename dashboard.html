<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Профиль — Umut Rocketry</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="nav-left">
      <a href="index.html" data-i18n="nav_participate">Участие</a>
      <a href="engines.html" data-i18n="nav_engines">Двигатели</a>
    </div>
    <a href="index.html" class="logo-container"><div class="logo-text">UMUT ROCKETRY</div></a>
    <div class="nav-right">
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
      <a href="#" id="logoutLink" data-i18n="nav_logout">Выйти</a>
    </div>
  </header>

  <main class="page-container">
    <div class="card reveal" style="max-width: 600px; margin: 0 auto; text-align: center;">
      <h1 style="color: var(--primary); margin-bottom: 20px;">Профиль</h1>
      <img src="images/participant-1.jpg" alt="Avatar" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin-bottom: 20px;">
      <h2 id="userName" style="font-size: 28px; margin-bottom: 10px;">Имя</h2>
      <p style="color: var(--text-muted); margin-bottom: 5px;">Email: <span id="userEmail">email@mail.com</span></p>
      <p style="color: var(--text-muted); margin-bottom: 30px;">Команда: <span id="userTeam">—</span></p>
      
      <div style="background: var(--accent-bg); padding: 20px; border-radius: 12px; color: var(--primary); font-weight: 600;">
        Статус заявки: На рассмотрении
      </div>
    </div>
  </main>
  <script src="main.js"></script>
</body>
</html>
